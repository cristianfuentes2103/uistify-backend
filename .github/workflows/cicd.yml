name: CI/CD (develop)

on:
  push:
    branches: [ develop ]

concurrency:
  group: develop-deploy
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build Maven (skip tests)
        run: ./mvnw -B -DskipTests package
      - name: Archive jar (opcional)
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/*.jar

  docker-build-push:
    name: docker-build-push
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/uistify-java-backend
          tags: |
            type=raw,value=latest
            type=raw,value=run-${{ github.run_number }}
            type=sha
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build & Push (runtime image)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: deploy-staging
    needs: docker-build-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH (docker compose pull & up)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.IP }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }} 
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd /home/deploy/uistify
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p '${{ secrets.DOCKER_PASSWORD }}'
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f || true
